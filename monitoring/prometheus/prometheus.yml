global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 1s
scrape_configs:
  - job_name: scoring
    static_configs:
      - targets: ["scoring-service:8000"]
  - job_name: storage
    static_configs:
      - targets: ["scores-sink:8001"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
