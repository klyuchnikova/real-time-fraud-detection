name: fraud-monitoring

x-app: &app
  image: fraud-monitoring-app:local
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-env
    DATABASE_URL: postgresql://fraud:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/fraud
    GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-local-grafana-reader}
    ARTIFACTS_ROOT: /shared
    MODEL_DIR: /shared/models
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    FRAUD_THRESHOLD: "0.98"
    TRAIN_DATA_CSV: /data/train.csv
    SUPPLY_BATCH_SIZE: ${SUPPLY_BATCH_SIZE:-100000}
    HISTORY_MONTHS: ${HISTORY_MONTHS:-36}
    TRAIN_ITERATIONS: ${TRAIN_ITERATIONS:-100}
  volumes:
    - ./artifacts/monitoring:/shared

x-airflow: &airflow
  image: fraud-monitoring-airflow:local
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-env
    <<: *app-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fraud:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-1}
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "60"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-homework-shared-web-secret
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
  volumes:
    - ./artifacts/monitoring:/shared
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  kafka-volume-init:
    image: apache/kafka:4.3.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic scores --partitions 1 --replication-factor 1

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fraud
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init-databases.sh:/docker-entrypoint-initdb.d/001-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 5s
      retries: 20

  artifact-init:
    <<: *app
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["mkdir -p /shared/models /shared/work /shared/dq_reports /opt/airflow/logs && chown -R 50000:0 /shared /opt/airflow/logs && chmod -R g+rwX /shared /opt/airflow/logs"]
    volumes:
      - ./artifacts/monitoring:/shared
      - airflow_logs:/opt/airflow/logs

  data-init:
    <<: *app
    user: "50000:0"
    command: ["python", "-m", "pipeline.initialize"]
    volumes:
      - ./artifacts/monitoring:/shared
      - ${TRAIN_DATA_CSV:-./teta-ml-1-2025/train.csv}:/data/train.csv:ro
    depends_on:
      artifact-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  model-init:
    <<: *app
    user: "50000:0"
    command: ["python", "-m", "pipeline.bootstrap"]
    depends_on:
      data-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["python", "/app/airflow_init.py"]
    depends_on:
      model-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  scoring-service:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "scoring_service.app"]
    volumes:
      - ./artifacts/monitoring/models:/shared/models:ro
    ports:
      - "127.0.0.1:${SCORING_METRICS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      model-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  scores-sink:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "scores_sink.app"]
    ports:
      - "127.0.0.1:${SINK_METRICS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/metrics')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      data-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  interface:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: interface/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      data-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 15

  tools:
    <<: *app
    profiles: ["tools"]
    volumes:
      - ./artifacts/monitoring:/shared
      - ./reports:/app/reports
    depends_on:
      model-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.smoke_stack"]

  transaction-simulator:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "transaction_simulator.app"]
    environment:
      <<: *app-env
      STREAM_RATE: ${STREAM_RATE:-10}
    volumes:
      - ${TRAIN_DATA_CSV:-./teta-ml-1-2025/train.csv}:/data/train.csv:ro
    depends_on:
      scoring-service:
        condition: service_healthy
      scores-sink:
        condition: service_healthy

  monitoring-init:
    <<: *app
    command: ["python", "-m", "pipeline.monitoring_access"]
    depends_on:
      data-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-local-grafana-reader}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    pid: host
    command:
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.netdev
      - --collector.filesystem
      - --collector.diskstats
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

volumes:
  kafka_data:
  postgres_data:
  airflow_logs:
  prometheus_data:
  grafana_data:
