name: transaction-analytics

x-dbt: &dbt
  image: transaction-analytics:local
  build: .
  environment:
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: analytics
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse-password}
    RAW_DATABASE: transactions_db
    ANALYTICS_DATABASE: analytics
    CLIENT_REGISTRY: /state/clients.sqlite
    TRAIN_DATA_CSV: /data/train.csv
    DBT_PROFILES_DIR: /workspace/dbt
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./dbt:/workspace/dbt
    - ./reports:/workspace/reports
    - ./docs:/workspace/docs
    - registry_data:/state
    - ${TRAIN_DATA_CSV:-./teta-ml-1-2025/train.csv}:/data/train.csv:ro
  depends_on:
    clickhouse:
      condition: service_healthy

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.20.9
    restart: unless-stopped
    mem_limit: 2g
    environment:
      CLICKHOUSE_DB: transactions_db
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-local-clickhouse-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  dbt:
    <<: *dbt
    profiles: ["tools"]

  dbt-docs:
    <<: *dbt
    profiles: ["docs"]
    working_dir: /workspace/dbt
    command: ["dbt", "docs", "serve", "--host", "0.0.0.0", "--port", "8080", "--no-browser"]
    ports:
      - "127.0.0.1:${DBT_DOCS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/index.html')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  clickhouse_data:
  registry_data:
