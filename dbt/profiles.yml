transaction_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: '{{ env_var(''CLICKHOUSE_HOST'', ''localhost'') }}'
      port: '{{ env_var(''CLICKHOUSE_PORT'', ''8123'') | int }}'
      user: '{{ env_var(''CLICKHOUSE_USER'', ''analytics'') }}'
      password: '{{ env_var(''CLICKHOUSE_PASSWORD'') }}'
      schema: '{{ env_var(''ANALYTICS_DATABASE'', ''analytics'') }}'
      secure: false
      threads: 2
      connect_timeout: 10
      send_receive_timeout: 300
      custom_settings:
        max_threads: 2
        max_memory_usage: 1200000000
        join_use_nulls: 1
